name: Build HØRN Windows (.exe)

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install npm dependencies
        run: npm install

      - name: Sync original HØRN logo to UI and EXE icon
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "src/assets" | Out-Null
          New-Item -ItemType Directory -Force -Path "src-tauri/icons" | Out-Null
          $logoSource = $null
          if (Test-Path "app-icon.png") { $logoSource = "app-icon.png" }
          elseif (Test-Path "src/assets/app-icon.png") { $logoSource = "src/assets/app-icon.png" }
          if (-not $logoSource) {
            Write-Error "Original app-icon.png not found in repository root!"
            exit 1
          }
          Copy-Item $logoSource "src/assets/app-icon.png" -Force
          Copy-Item $logoSource "src-tauri/icons/app-icon.png" -Force
          npx tauri icon $logoSource

      - name: Build HØRN (.exe)
        run: npm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: HORN-v0.2-Windows
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/horn.exe

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.2.5
          name: HØRN v0.2 (Island Studio & Icon Batch)
          body: |
            ### HØRN v0.2 — Обновление
            - Island Studio: 8 готовых режимов + конструктор Custom с пресетами
            - Исправлена загрузка оригинального логотипа в UI, Dynamic Island и EXE
            - Icon Studio: массовое применение «Применить ко всем иконкам» + бэкап и откат
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/horn.exe
