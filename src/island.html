<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <title>HØRN Dynamic Island</title>
  <link rel="stylesheet" href="styles/tokens.css" />
  <link rel="stylesheet" href="styles/island.css" />
</head>
<body class="island-body">
  <div class="island-stage" id="island-stage">
    <div class="island-capsule state-compact theme-obsidian" id="island-capsule">
      <!-- Compact -->
      <div class="island-view visible" id="view-compact">
        <div class="compact-left">
          <img data-brand-logo src="assets/app-icon.png" alt="HØRN" class="island-logo-sm" />
          <span class="compact-brand" id="compact-summary">HØRN</span>
        </div>
        <span class="compact-clock" id="compact-clock">00:00</span>
      </div>

      <!-- Activity (Focus Timer / Music Live) -->
      <div class="island-view" id="view-activity">
        <div class="compact-left">
          <div class="activity-bars"><span></span><span></span><span></span><span></span></div>
          <span class="activity-meta" id="activity-label">Фокус-таймер</span>
        </div>
        <span class="activity-meta" id="activity-value">25:00</span>
      </div>

      <!-- Temporary Notification Overlay -->
      <div class="island-view notif-view" id="view-notification">
        <img data-brand-logo src="assets/app-icon.png" alt="HØRN" class="notif-logo" />
        <div style="min-width:0;flex:1;">
          <div style="display:flex;justify-content:space-between;align-items:center;">
            <div class="notif-title" id="notif-title">HØRN</div>
            <span class="notif-app" id="notif-app">System</span>
          </div>
          <div class="notif-sub" id="notif-sub">Системное уведомление</div>
        </div>
      </div>

      <!-- Expanded Dynamic Mode Host -->
      <div class="island-view expanded-view" id="view-expanded">
        <div class="exp-top">
          <div class="compact-left">
            <img data-brand-logo src="assets/app-icon.png" alt="HØRN" class="island-logo-sm" />
            <span class="exp-title" id="exp-mode-title">SYSTEM MONITOR</span>
          </div>
          <div class="mode-pills" id="island-mode-switcher"></div>
        </div>

        <div class="exp-body" id="exp-body"></div>

        <div class="exp-actions">
          <button class="exp-btn" id="btn-toggle-focus">Фокус</button>
          <button class="exp-btn" id="btn-open-horn">Открыть HØRN</button>
          <button class="exp-btn" id="btn-collapse">Свернуть</button>
        </div>
      </div>
    </div>
  </div>
  <script type="module" src="js/island/controller.js"></script>
</body>
</html>
