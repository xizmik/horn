<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HØRN</title>
  <link rel="stylesheet" href="styles/tokens.css" />
  <link rel="stylesheet" href="styles/main.css" />
</head>
<body>
  <div class="app-shell">
    <header class="titlebar" data-tauri-drag-region>
      <div class="titlebar-label">HØRN Desktop Platform • v0.2</div>
      <div class="window-controls">
        <button class="win-btn" id="btn-min" title="Свернуть">
          <svg width="12" height="12" viewBox="0 0 12 12"><path d="M2 6h8" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
        </button>
        <button class="win-btn" id="btn-max" title="Развернуть">
          <svg width="12" height="12" viewBox="0 0 12 12"><rect x="2.2" y="2.2" width="7.6" height="7.6" rx="1.6" fill="none" stroke="currentColor" stroke-width="1.3"/></svg>
        </button>
        <button class="win-btn close" id="btn-close" title="Скрыть в фон">
          <svg width="12" height="12" viewBox="0 0 12 12"><path d="M2.5 2.5l7 7m0-7l-7 7" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
        </button>
      </div>
    </header>

    <div class="workspace">
      <aside class="sidebar">
        <div>
          <div class="sidebar-brand">
            <img src="assets/app-icon.png" alt="HØRN" class="sidebar-logo" />
            <div>
              <div class="brand-name">HØRN</div>
              <div class="brand-sub">v0.2 STUDIO</div>
            </div>
          </div>
          <nav class="nav-list" id="sidebar-nav"></nav>
        </div>
        <div class="sidebar-footer">
          <div class="status-row">
            <span class="status-dot" id="island-status-dot"></span>
            <span id="island-status-text">Dynamic Island активен</span>
          </div>
          <div id="os-badge" style="font-size: 11px; color: var(--text-muted);">Windows Engine</div>
        </div>
      </aside>

      <main class="content" id="page-container"></main>
    </div>
  </div>
  <div class="toast" id="toast"></div>
  <script type="module" src="js/main.js"></script>
</body>
</html>
